<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treamise Cloud | Главная</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(22, 27, 34, 0.8);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #58a6ff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
        }
        p {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 30px;
        }
        .ip-box {
            background-color: #010409;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px dashed #238636;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .ip-box:hover {
            border-color: #2ea44f;
            background-color: #161b22;
            transform: scale(1.02);
        }
        .ip-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.3rem;
            color: #7ee787;
            font-weight: bold;
        }
        .copy-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TREAMISE CLOUD</h1>
    <p>Добро пожаловать! Наш кроссплатформенный сервер Майнкрафт (1.21.1 - 1.26+) уже готовится к запуску!</p>
    
    <div class="ip-box" onclick="copyIP()">
        <span class="ip-text" id="server-ip">treamise.eu.org</span>
        <button class="copy-btn">Скопировать IP</button>
    </div>

    <div class="footer">
        Powered by GitHub Pages & Cloudflare | © 2026 MarloopYT
    </div>
</div>

<script>
    function copyIP() {
        const ipText = document.getElementById('server-ip').innerText;
        navigator.clipboard.writeText(ipText).then(() => {
            alert('IP-адрес сервера успешно скопирован! Вставляй в Minecraft и залетай к нам.');
        });
    }
</script>

</body>
</html>
